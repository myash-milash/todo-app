<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        font-family: "Montserrat Alternates", sans-serif;
        padding: 50px;
        background-color: #fff0f0;
        font-size: 20px;
      }
      #taskInput {
        width: 350px;
        height: 15px;
        border-radius: 15px;
        padding: 10px;
        border: 1px solid black;
        font-size: 20px;
      }
      #taskList {
        display: flex;
        flex-direction: column;
        margin-top: 10px;
        gap: 5px;
      }
      .taskDiv {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .completed .taskContent label {
        text-decoration: line-through;
      }
      .completed .taskContent {
        background: #d3bdbda9;
      }
      .taskContent {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0px 5px 0px 30px;
        background: #f5d9d9;
        width: 265px;
        height: 50px;
        border-radius: 15px;

        border: 1px solid black;
        overflow-wrap: break-word;
      }
      .taskDeleteBtn,
      #taskAddBtn {
        width: 40px;
        height: 40px;
        border-radius: 50%;

        border: 1px solid black;
        background: #bda3a3;
      }
      #taskAddBtn {
        background: #e7b9b9;
      }
      .taskCheckbox {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <h1>ToDo List</h1>
    <div id="taskCount">Всего задач: 0 Выполнено: 0 Осталось выполнить: 0</div>
    <input id="taskInput" type="text" />
    <button id="taskAddBtn">+</button>
    <div id="message"></div>
    <div id="taskList"></div>
  </body>

  <script>
    const taskInput = document.getElementById(`taskInput`);
    const taskAddBtn = document.getElementById(`taskAddBtn`);
    const taskList = document.getElementById(`taskList`);
    const message = document.getElementById(`message`);
    let taskArr = uploadTasks();
    renderTasks();

    taskList.addEventListener("click", (e) => {
      const taskDiv = e.target.closest(".taskDiv");
      if (!taskDiv) return;

      const currentIndex = taskDiv.dataset.index;
      if (e.target.closest(`.taskDeleteBtn`)) {
        deleteTask(currentIndex);
      } else if (e.target.closest(`.taskCheckbox`)) {
        completeTask(taskArr[currentIndex]);
      }
    });
    taskList.addEventListener("dblclick", (e) => {
      const task = e.target.closest(".taskContent");
      const taskDiv = e.target.closest(".taskDiv");

      if (!task) return;

      const currentIndex = taskDiv.dataset.index;
      editTask(currentIndex);
    });
    taskList.addEventListener("focusout", (e) => {
      const taskDiv = e.target.closest(".taskDiv");
      const editInput = e.target.closest(".taskEditInput");

      const currentIndex = taskDiv.dataset.index;
      if (!editInput) return;
      saveEditTask(currentIndex, editInput);
    });
    taskList.addEventListener("keydown", (e) => {
      const taskDiv = e.target.closest(".taskDiv");
      const editInput = e.target.closest(".taskEditInput");

      const currentIndex = taskDiv.dataset.index;
      if (!editInput) return;
      if (e.key === "Enter") {
        editInput.blur();
      }
    });
    function renderTasks() {
      taskList.innerHTML = taskArr
        .sort(
          (a, b) =>
            a.completed - b.completed ||
            b.completedAt - a.completedAt ||
            b.createdAt - a.createdAt,
        )
        .map(function (item, index) {
          return `<div class="taskDiv${item.completed ? " completed" : ""}" data-index="${index}">
        <input type="checkbox" class="taskCheckbox" ${item.completed ? "checked" : ""}/>
        <div class="taskContent">
          ${
            item.isEditing
              ? `
              <input class="taskEditInput" type="text" value="${item.text}" />
            `
              : `
              <label class="taskLabel">
                ${item.text}
              </label>
            `
          }

          <button class="taskDeleteBtn">x</button>
        </div>
      </div>`;
        })
        .join(``);

      let activeEditInput = document.querySelector(".taskEditInput");
      if (activeEditInput) {
        makeFocusedInput(activeEditInput);
      }

      saveTasks(taskArr);

      renderTaskCount();
    }
    function makeFocusedInput(input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    function editTask(index) {
      taskArr[index].isEditing = !taskArr[index].isEditing;

      renderTasks();
    }
    function saveEditTask(index, editInput) {
      if (taskArr[index].isEditing) {
        taskArr[index].text = editInput.value;
        console.log(editInput.value);
      }
      editTask(index);
    }
    function saveTasks(tasks) {
      localStorage.setItem(`tasks`, JSON.stringify(tasks));
      console.log(`Данные сохранены`);
    }
    function uploadTasks() {
      const tasksFromLocalStorage = localStorage.getItem(`tasks`);
      if (!tasksFromLocalStorage) return [];
      console.log(`Данные выгружены`);
      return JSON.parse(tasksFromLocalStorage);
    }
    function renderTaskCount() {
      let taskCount = document.getElementById(`taskCount`);
      taskCount.innerHTML = `Всего задач: ${taskArr.length}
      Выполнено: ${taskArr.filter((item) => item.completed === true).length}
      Осталось выполнить: ${taskArr.filter((item) => item.completed === false).length} `;
    }
    function completeTask(task) {
      task.completed = !task.completed;
      if (task.completed) {
        task.completedAt = Date.now();
      } else task.completedAt = null;
      renderTasks();
    }
    function deleteTask(taskIndex) {
      taskArr.splice(taskIndex, 1);
      renderTasks();
    }

    function addNewTask() {
      if (taskInput.value != ``) {
        message.innerHTML = ``;
        taskArr.push({
          text: taskInput.value,
          completed: false,
          isEditing: false,
          createdAt: Date.now(),
          completedAt: null,
        });
        renderTasks();
      } else {
        message.innerHTML = `Заполните поле`;
      }
    }
    taskAddBtn.addEventListener(`click`, function () {
      addNewTask();
    });
    taskInput.addEventListener(`keydown`, function (event) {
      if (event.key === `Enter`) {
        addNewTask();
      }
    });
  </script>
</html>
